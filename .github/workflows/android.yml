name: Android Community CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify Android-only source
      run: ./scripts/verify-android-only.sh

    - name: Verify telecom manifest contract
      run: ./scripts/verify-telecom-contract.sh

    - name: Verify feature boundaries
      run: ./scripts/verify-feature-boundaries.sh

    - name: Verify source formatting
      run: ./scripts/verify-source-format.sh

    - name: Verify quality contracts
      run: ./scripts/verify-quality-contract.sh

    - name: Verify performance tooling
      run: ./scripts/verify-performance-tools.sh

    - name: Verify Play listing localization
      run: ./scripts/verify-play-listing.sh

    - name: Verify current public readiness
      run: ./scripts/verify-public-ready.sh --current-only

    - name: Run Kotlin checks, build, tests and lint
      run: |
        plan=$(./scripts/ci-affected-modules.py --full)
        read -ra tasks <<< "$(sed -n 's/^tasks=//p' <<< "$plan")"
        rm -f app/build/reports/lint-results-communityDebug.xml app/build/reports/lint-results-playRelease.xml
        lint_run_started_at=$(date +%s)
        ./gradlew :app:generateReleaseManifest "${tasks[@]}" --stacktrace
        LINT_RUN_STARTED_AT="$lint_run_started_at" ./scripts/verify-lint-ratchet.sh communityDebug playRelease

    - name: Verify release metadata
      if: ${{ github.event_name != 'pull_request' }}
      run: ./scripts/verify-release-metadata.sh

    - name: Upload debug APK
      uses: actions/upload-artifact@v7
      # APKs are useful for an explicitly requested manual QA run, but are too
      # large to retain for every successful push.
      if: ${{ success() && github.event_name == 'workflow_dispatch' }}
      with:
        name: community-debug-apk
        path: app/build/outputs/apk/community/debug/*.apk
        retention-days: 1

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: test-results-failure
        path: '**/build/test-results/'
        retention-days: 1

    - name: Upload lint report
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: lint-report-failure
        path: app/build/reports/lint-results-communityDebug.html
        retention-days: 1

name: PR Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Gradle wrapper
      uses: gradle/wrapper-validation-action@v3

    - name: Verify Android-only source
      run: ./scripts/verify-android-only.sh

    - name: Verify telecom manifest contract
      run: ./scripts/verify-telecom-contract.sh

    - name: Verify feature boundaries
      run: ./scripts/verify-feature-boundaries.sh

    - name: Verify source formatting
      run: ./scripts/verify-source-format.sh

    - name: Verify quality contracts
      run: ./scripts/verify-quality-contract.sh

    - name: Verify performance tooling
      run: ./scripts/verify-performance-tools.sh

    - name: Verify Play listing localization
      run: ./scripts/verify-play-listing.sh

    - name: Verify current public readiness
      run: ./scripts/verify-public-ready.sh --current-only

    - name: Run Kotlin checks, build, tests and lint
      run: |
        rm -f app/build/reports/lint-results-communityDebug.xml app/build/reports/lint-results-playRelease.xml
        lint_run_started_at=$(date +%s)
        ./gradlew ktlintCheck assembleCommunityDebug testCommunityDebugUnitTest lintCommunityDebug lintPlayRelease --stacktrace
        LINT_RUN_STARTED_AT="$lint_run_started_at" ./scripts/verify-lint-ratchet.sh communityDebug playRelease

    - name: Comment PR with test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: app/build/test-results/**/*.xml
        check_name: Unit Test Results
        comment_mode: off
      continue-on-error: true

    - name: Upload failure diagnostics
      uses: actions/upload-artifact@v7
      # Keep diagnostics available for investigation, without retaining APKs
      # and reports from every successful pull request.
      if: ${{ failure() }}
      with:
        name: pr-check-diagnostics
        path: |
          app/build/outputs/apk/community/debug/*.apk
          app/build/reports/
          app/build/test-results/
        retention-days: 1
